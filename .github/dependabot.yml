version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /database
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, database]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
