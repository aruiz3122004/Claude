<?xml version="1.0" encoding="UTF-8"?>
<!--
  og-cover.svg — Open Graph cover 1200x630 para Metalúrgica del Caribe.
  Placeholder vectorial. Para producción, exportar a JPG con:
    rsvg-convert -w 1200 -h 630 -f png frontend/public/og-cover.svg | magick png:- frontend/public/og-cover.jpg
    (o)  npx svgexport frontend/public/og-cover.svg frontend/public/og-cover.jpg 1200:630
  Ver también frontend/README.md §OG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Metalúrgica del Caribe — Herrería industrial en Barranquilla">
  <title>Metalúrgica del Caribe — Herrería industrial en Barranquilla</title>

  <!-- Fondo oscuro industrial (var(--bg)) -->
  <rect width="1200" height="630" fill="#0E1116"/>

  <!-- Patrón blueprint sutil -->
  <defs>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1D2430" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0E1116" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E1116" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Marca de acento vertical izquierda -->
  <rect x="0" y="0" width="8" height="630" fill="#E8521D"/>

  <!-- Brand-mark grande (reutilizado de assets/brand-mark.svg, viewBox 40x40) -->
  <g transform="translate(90,120) scale(8)">
    <path d="M4 32 L20 6 L36 32 Z" fill="none" stroke="#E8521D" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="20" cy="24" r="4" fill="#E8521D"/>
    <path d="M12 32 L28 32" stroke="#E8521D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Nombre en Oswald (con fallbacks) -->
  <text x="90" y="500"
        font-family="Oswald, Impact, 'Arial Narrow', sans-serif"
        font-weight="700" font-size="104" fill="#ECECEE"
        letter-spacing="2">
    METALÚRGICA
  </text>
  <text x="90" y="568"
        font-family="Oswald, Impact, 'Arial Narrow', sans-serif"
        font-weight="500" font-size="40" fill="#9BA3AD"
        letter-spacing="12">
    DEL CARIBE · BARRANQUILLA
  </text>

  <!-- Tagline del hero -->
  <text x="650" y="340"
        font-family="Oswald, Impact, 'Arial Narrow', sans-serif"
        font-weight="600" font-size="72" fill="#ECECEE">
    Metal
  </text>
  <text x="650" y="420"
        font-family="Oswald, Impact, 'Arial Narrow', sans-serif"
        font-weight="700" font-size="72" fill="#ECECEE">
    que <tspan fill="#E8521D">aguanta</tspan>
  </text>
  <text x="650" y="500"
        font-family="Oswald, Impact, 'Arial Narrow', sans-serif"
        font-weight="600" font-size="72" fill="#ECECEE">
    el oficio.
  </text>

  <!-- Línea de referencia inferior derecha (motivo "plano de taller") -->
  <line x1="650" y1="540" x2="1100" y2="540" stroke="#3A414C" stroke-width="1"/>
  <text x="650" y="572"
        font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" fill="#9BA3AD" letter-spacing="2">
    HERRERÍA · ESTRUCTURAS METÁLICAS · DESDE 1999
  </text>
</svg>
